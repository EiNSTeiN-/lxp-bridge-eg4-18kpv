name: Docker Development Build

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified images to GHCR
        type: boolean
        default: false
      version:
        description: Image version (dev or a release tag)
        type: string
        default: dev
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      version:
        type: string
        default: dev
    secrets:
      GHCR_RELEASE_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Docker build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: aarch64
          runner: ubuntu-24.04-arm
    env:
      BRIDGE_ARCH: ${{ matrix.arch }}
      BRIDGE_VERSION: ${{ inputs.version || 'dev' }}
      REGISTRY_NAMESPACE: ghcr.io/einstein-docker
    steps:
      - uses: actions/checkout@v4

      - name: Check publishing credentials
        id: registry
        env:
          HAS_RELEASE_TOKEN: ${{ secrets.GHCR_RELEASE_TOKEN != '' }}
          PUBLISH_REQUESTED: ${{ inputs.publish || github.event_name == 'push' }}
        run: |
          if [[ "$PUBLISH_REQUESTED" == true && "$HAS_RELEASE_TOKEN" == true ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            if [[ "$PUBLISH_REQUESTED" == true ]]; then
              echo "::notice::Registry publishing skipped: set GHCR_RELEASE_TOKEN with package access to EiNSTeiN-docker. Verified image archives will still be available."
            fi
          fi

      - name: Login to GitHub Container Registry
        if: steps.registry.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_RELEASE_TOKEN }}

      - name: Build and verify the bridge and Home Assistant app
        id: images
        run: bash ci/build-images.sh

      - name: Publish verified images
        if: steps.registry.outputs.publish == 'true'
        env:
          IMAGE_VERSION: ${{ steps.images.outputs.version }}
        run: |
          docker push "${REGISTRY_NAMESPACE}/lxp-bridge-eg4-18kpv-${BRIDGE_ARCH}:${IMAGE_VERSION}"
          docker push "${REGISTRY_NAMESPACE}/lxp-bridge-eg4-18kpv-addon-${BRIDGE_ARCH}:${IMAGE_VERSION}"
          if [[ "$BRIDGE_VERSION" == dev ]]; then
            docker push "${REGISTRY_NAMESPACE}/lxp-bridge-eg4-18kpv-${BRIDGE_ARCH}:dev"
            docker push "${REGISTRY_NAMESPACE}/lxp-bridge-eg4-18kpv-addon-${BRIDGE_ARCH}:dev"
          fi

      - name: Export the verified app image
        env:
          IMAGE_VERSION: ${{ steps.images.outputs.version }}
        run: |
          image_tags=(
            "${REGISTRY_NAMESPACE}/lxp-bridge-eg4-18kpv-${BRIDGE_ARCH}:${IMAGE_VERSION}"
            "${REGISTRY_NAMESPACE}/lxp-bridge-eg4-18kpv-addon-${BRIDGE_ARCH}:${IMAGE_VERSION}"
          )
          if [[ "$BRIDGE_VERSION" == dev ]]; then
            image_tags+=(
              "${REGISTRY_NAMESPACE}/lxp-bridge-eg4-18kpv-${BRIDGE_ARCH}:dev"
              "${REGISTRY_NAMESPACE}/lxp-bridge-eg4-18kpv-addon-${BRIDGE_ARCH}:dev"
            )
          fi
          docker save --output "${RUNNER_TEMP}/eg4-addon-${BRIDGE_ARCH}.tar" "${image_tags[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: eg4-addon-${{ matrix.arch }}
          path: ${{ runner.temp }}/eg4-addon-${{ matrix.arch }}.tar
          compression-level: 0
