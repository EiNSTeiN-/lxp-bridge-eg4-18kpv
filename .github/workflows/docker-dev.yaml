name: Docker Development Build

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified images to GHCR
        type: boolean
        default: false
      version:
        description: Image version (dev or a release tag)
        type: string
        default: dev
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      version:
        type: string
        default: dev
    secrets:
      GHCR_RELEASE_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Docker build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: aarch64
          runner: ubuntu-24.04-arm
    env:
      BRIDGE_ARCH: ${{ matrix.arch }}
      BRIDGE_VERSION: ${{ inputs.version || 'dev' }}
      REGISTRY_NAMESPACE: ghcr.io/einstein-docker
    steps:
      - uses: actions/checkout@v4

      - name: Check publishing credentials
        if: inputs.publish || github.event_name == 'push'
        env:
          HAS_RELEASE_TOKEN: ${{ secrets.GHCR_RELEASE_TOKEN != '' }}
        run: |
          if [[ "$HAS_RELEASE_TOKEN" != true ]]; then
            echo "Set GHCR_RELEASE_TOKEN with read:packages and write:packages access to EiNSTeiN-docker." >&2
            exit 1
          fi

      - name: Login to GitHub Container Registry
        if: inputs.publish || github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_RELEASE_TOKEN }}

      - name: Build and verify the bridge and Home Assistant app
        run: bash ci/build-images.sh

      - name: Publish verified images
        if: inputs.publish || github.event_name == 'push'
        run: |
          docker push "${REGISTRY_NAMESPACE}/lxp-bridge-eg4-18kpv-${BRIDGE_ARCH}:${BRIDGE_VERSION}"
          docker push "${REGISTRY_NAMESPACE}/lxp-bridge-eg4-18kpv-addon-${BRIDGE_ARCH}:${BRIDGE_VERSION}"

      - name: Export the verified app image
        run: |
          docker save --output "${RUNNER_TEMP}/eg4-addon-${BRIDGE_ARCH}.tar" \
            "${REGISTRY_NAMESPACE}/lxp-bridge-eg4-18kpv-addon-${BRIDGE_ARCH}:${BRIDGE_VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: eg4-addon-${{ matrix.arch }}
          path: ${{ runner.temp }}/eg4-addon-${{ matrix.arch }}.tar
          compression-level: 0
